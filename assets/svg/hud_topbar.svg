<svg xmlns="http://www.w3.org/2000/svg" width="920" height="40" viewBox="0 0 920 40" shape-rendering="crispEdges">
  <!-- Full-strip base: the GUI paints all live text on top of this flat field. -->
  <rect x="0" y="0" width="920" height="40" fill="#141414"/>

  <!-- 1px rules: top neutral, bottom accent. Both outside every safe zone. -->
  <rect x="0" y="0" width="920" height="1" fill="#6E6E6E"/>
  <rect x="0" y="39" width="920" height="1" fill="#3C64DC"/>

  <!-- Thin vertical separators, y=4..35. The x=532 divider is split into two
       stubs so it never paints inside the DAY safe zone (x=416..536, y=8..32). -->
  <rect x="408" y="4" width="1" height="32" fill="#2C2C34"/>
  <rect x="532" y="4" width="1" height="4" fill="#2C2C34"/>
  <rect x="532" y="32" width="1" height="4" fill="#2C2C34"/>
  <rect x="688" y="4" width="1" height="32" fill="#2C2C34"/>
  <rect x="808" y="4" width="1" height="32" fill="#2C2C34"/>

  <!-- 'master plan' emblem: 16x16 at (876,12), 1px #141414 frame with a
       4x4 grid of 3px cells (checkerboard of the two contract greens/blues). -->
  <rect x="876" y="12" width="16" height="16" fill="#141414"/>
  <rect x="876" y="12" width="16" height="1" fill="#141414"/>
  <rect x="876" y="27" width="16" height="1" fill="#141414"/>
  <rect x="876" y="12" width="1" height="16" fill="#141414"/>
  <rect x="891" y="12" width="1" height="16" fill="#141414"/>
  <rect x="878" y="14" width="3" height="3" fill="#3CA03C"/>
  <rect x="881" y="14" width="3" height="3" fill="#3C64DC"/>
  <rect x="884" y="14" width="3" height="3" fill="#3CA03C"/>
  <rect x="887" y="14" width="3" height="3" fill="#3C64DC"/>
  <rect x="878" y="17" width="3" height="3" fill="#3C64DC"/>
  <rect x="881" y="17" width="3" height="3" fill="#3CA03C"/>
  <rect x="884" y="17" width="3" height="3" fill="#3C64DC"/>
  <rect x="887" y="17" width="3" height="3" fill="#3CA03C"/>
  <rect x="878" y="20" width="3" height="3" fill="#3CA03C"/>
  <rect x="881" y="20" width="3" height="3" fill="#3C64DC"/>
  <rect x="884" y="20" width="3" height="3" fill="#3CA03C"/>
  <rect x="887" y="20" width="3" height="3" fill="#3C64DC"/>
  <rect x="878" y="23" width="3" height="3" fill="#3C64DC"/>
  <rect x="881" y="23" width="3" height="3" fill="#3CA03C"/>
  <rect x="884" y="23" width="3" height="3" fill="#3C64DC"/>
  <rect x="887" y="23" width="3" height="3" fill="#3CA03C"/>

  <!-- Pause-glyph placeholder slot: 16x16 at (812,12), #6E6E6E frame with
       two #6E6E6E bars on the flat #141414 field. -->
  <rect x="812" y="12" width="16" height="1" fill="#6E6E6E"/>
  <rect x="812" y="27" width="16" height="1" fill="#6E6E6E"/>
  <rect x="812" y="12" width="1" height="16" fill="#6E6E6E"/>
  <rect x="827" y="12" width="1" height="16" fill="#6E6E6E"/>
  <rect x="816" y="16" width="3" height="8" fill="#6E6E6E"/>
  <rect x="821" y="16" width="3" height="8" fill="#6E6E6E"/>

  <!-- Optional dim corner ticks (outside all text-safe zones). -->
  <rect x="2" y="19" width="5" height="1" fill="#2C2C34"/>
  <rect x="914" y="19" width="4" height="1" fill="#2C2C34"/>
</svg>
